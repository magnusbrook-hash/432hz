name: SoundCloud Auto Upload

on:
  schedule:
    - cron: '0 */6 * * *'   # Toutes les 6 heures
  workflow_dispatch:          # Déclenchement manuel possible

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Évite l’avertissement Node 20 (actions checkout/setup-python) — cf. blog GitHub Actions
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          pip install requests

      - name: Download pending MP3s from server & upload to SoundCloud
        env:
          # Accepte SC_OAUTH_TOKEN (recommandé) ou SC_TOKEN si le secret a été mal nommé
          SC_TOKEN: ${{ secrets.SC_OAUTH_TOKEN || secrets.SC_TOKEN }}
          # Client_id public SoundCloud web — secret optionnel (repli ci-dessous)
          SC_CLIENT_ID: ${{ secrets.SC_CLIENT_ID || '5S6lc0DNynNbQjkTQNDNtDDmWqdo1v0R' }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
        run: |
          python3 - << 'PYEOF'
          import os, sys, requests, subprocess, time
          from pathlib import Path

          def need(env_name, secret_hint):
              v = os.environ.get(env_name, "").strip()
              if not v:
                  print(f"❌ Variable vide: {env_name}")
                  print(f"   → Ajoute le secret GitHub : {secret_hint}")
                  print("   → Settings → Secrets and variables → Actions → New repository secret")
                  sys.exit(1)
              return v

          raw = need("SC_TOKEN", "SC_OAUTH_TOKEN ou SC_TOKEN")
          CID = need("SC_CLIENT_ID", "SC_CLIENT_ID")
          HOST = need("SERVER_HOST", "SERVER_HOST")
          USER = need("SERVER_USER", "SERVER_USER")
          PASSWD = need("SERVER_PASS", "SERVER_PASS")

          TOKEN = raw if raw.lower().startswith("oauth ") else f"OAuth {raw}"
          QUEUE    = '/home/ubuntu/soundcloud_queue'
          DONE     = '/home/ubuntu/soundcloud_queue_done'
          API      = 'https://api-v2.soundcloud.com'
          TMP      = Path('/tmp/sc_queue')
          TMP.mkdir(exist_ok=True)

          def ssh(cmd):
              r = subprocess.run(
                  ['sshpass', '-p', PASSWD, 'ssh', '-o', 'StrictHostKeyChecking=no',
                   f'{USER}@{HOST}', cmd],
                  capture_output=True, text=True, timeout=30)
              if r.returncode != 0 and r.stderr.strip():
                  print(f"   [ssh stderr] {r.stderr.strip()[:500]}")
              return r.returncode, r.stdout.strip()

          def scp_get(remote, local):
              r = subprocess.run(
                  ['sshpass', '-p', PASSWD, 'scp', '-o', 'StrictHostKeyChecking=no',
                   f'{USER}@{HOST}:{remote}', str(local)],
                  capture_output=True, text=True, timeout=120)
              if r.returncode != 0:
                  print(f"   [scp stderr] {r.stderr.strip()[:500]}")
              return r.returncode == 0

          headers = {
              'Authorization': TOKEN,
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
              'Accept': 'application/json',
              'Origin': 'https://soundcloud.com',
              'Referer': 'https://soundcloud.com/',
          }

          # Vérifier le token
          try:
              r = requests.get(f'{API}/me', params={'client_id': CID}, headers=headers, timeout=15)
          except requests.RequestException as e:
              print(f"❌ Erreur réseau vers SoundCloud: {e}")
              sys.exit(1)

          print(f'/me → {r.status_code}')
          if r.status_code != 200:
              print(f"Réponse: {r.text[:300]}")
              print('Token SoundCloud invalide ou expiré — régénère le token et mets à jour SC_OAUTH_TOKEN.')
              sys.exit(1)
          print(f"Compte: {r.json().get('username')}")

          # Test SSH serveur
          code, ping = ssh('echo OK')
          if code != 0 or ping != 'OK':
              print('❌ SSH vers le serveur a échoué — vérifie SERVER_HOST, SERVER_USER, SERVER_PASS et que ssh/sshd accepte le compte.')
              sys.exit(1)

          # Lister les MP3 en queue sur le serveur
          _, files_raw = ssh(f'ls {QUEUE}/*.mp3 2>/dev/null || true')
          if not files_raw:
              print('Aucun fichier en queue (dossier vide ou inexistant).')
              sys.exit(0)

          remote_files = [f.strip() for f in files_raw.splitlines() if f.strip()]
          print(f'{len(remote_files)} fichier(s) en queue')

          count = 0
          blocked = False
          for remote_path in remote_files[:5]:  # Max 5 par run
              filename = Path(remote_path).name
              stem = Path(filename).stem
              title = stem.replace('_432Hz','').replace('_432hz','').replace('_',' ').strip() + ' - 432Hz'

              local_file = TMP / filename
              print(f'\nTéléchargement: {filename}')
              if not scp_get(remote_path, local_file):
                  print(f'Erreur SCP')
                  continue

              print(f'Upload: {title}')
              with open(local_file, 'rb') as f:
                  resp = requests.post(
                      f'{API}/tracks',
                      params={'client_id': CID},
                      headers=headers,
                      files={'track[asset_data]': (filename, f, 'audio/mpeg')},
                      data={
                          'track[title]': title,
                          'track[sharing]': 'public',
                          'track[tag_list]': '"432hz" "healing frequency" "music"',
                          'track[description]': 'Converti en 432Hz par https://432hz-converter.com/\n\n#432hz',
                          'track[genre]': '432hz',
                      },
                      timeout=300,
                  )

              print(f'Status: {resp.status_code} | {resp.text[:200]}')

              if resp.status_code in (200, 201):
                  url = resp.json().get('permalink_url', '')
                  print(f'✅ Publié: {url}')
                  ssh(f'mkdir -p {DONE} && mv "{remote_path}" {DONE}/')
                  count += 1
                  time.sleep(5)
              elif resp.status_code == 403:
                  print('❌ DataDome / anti-bot (403) — IP GitHub bloquée pour POST /tracks.')
                  blocked = True
                  break

              local_file.unlink(missing_ok=True)

          print(f'\n✅ {count} track(s) publiés')
          if blocked:
              sys.exit(1)
          PYEOF
